name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # CONTROL DE SEGURIDAD — este backend se despliega como ANYONE_ANONYMOUS: cualquiera en
  # internet puede invocar lo que esté en su dispatcher. Un backend así con credenciales de
  # ESCRITURA de AppSheet es un vector de ataque directo, así que TODA escritura vive en el
  # KMS y se alcanza vía kmsProxy_. Este trabajo comprueba que sigue siendo verdad.
  #
  # Vive AQUÍ y no en el KMS a propósito: el control nació allí leyendo este repositorio
  # como hermano de checkout, y en la integración continua del KMS ese hermano no existe,
  # así que se declaraba INERTE y no comprobaba nada. El control se ejecuta donde vive el
  # código que vigila. `build` depende de él: en ROJO no se publica.
  #
  # No necesita `npm ci`, ni navegador, ni red: solo lee ficheros (~1 s).
  escrituras-directas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # El veredicto se lee de la ÚLTIMA línea, nunca del código de salida — pero el código
      # de salida es lo que hace fallar este trabajo, así que NO se canaliza por una tubería
      # (una tubería devuelve el código del último comando, y así se cuela un rojo como verde).
      - name: Ninguna escritura directa a AppSheet desde el backend anónimo
        run: node scripts/comprobar-escrituras-directas.mjs

  # CONTROL DE ALCANCE — los filtros que este backend manda a AppSheet tienen que estar
  # escritos en el lenguaje que AppSheet entiende. `AND`/`OR` son FUNCIONES: puestos entre
  # medias, AppSheet NO da error — se queda con la PRIMERA condición y descarta el resto en
  # silencio. Medido el 2026-08-03: en `recFiles` eso devolvía las 23 filas vivas de la
  # escuela (21 familias) a una familia que tenía 3; en la recuperación por email hacía que
  # las guardas `ISBLANK` no se aplicaran y un expediente abandonado pasara por «ya enviada».
  #
  # La batería de navegador NO puede cazar esto: corre contra un backend simulado y nunca
  # llega a construir un Selector. Por eso este control existe aparte. `build` depende de él.
  #
  # No necesita `npm ci`, ni navegador, ni red: lee el traductor real y lo ejecuta (~1 s).
  selector-appsheet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Sin tubería: el veredicto se lee de la última línea, pero es el código de salida el
      # que hace fallar el trabajo, y una tubería devolvería el del último comando.
      - name: Los filtros a AppSheet usan AND()/OR() como funciones, no infijos
        run: node scripts/comprobar-selector-appsheet.mjs

  # MURO DE DEPLOY — la batería del wizard tiene que estar VERDE antes de publicar.
  # Regla de los dos repos (CLAUDE.md §"No se toca lo que funciona sin una forma de
  # comprobar que sigue funcionando"): el 2026-07-27 un cambio de seguridad estuvo a
  # punto de romper el alta de solicitudes nuevas y no había NADA que lo cazara.
  # `build` depende de este job: si la batería sale ROJA, no se publica nada.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # Playwright NO es dependencia del wizard: se instala solo para la batería, sin
      # tocar package.json ni el lock (--no-save) para no ensuciar el bundle publicado.
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
        working-directory: frontend

      # La batería compila su propio bundle con backend SIMULADO (VITE_GAS_ENDPOINT=/__gas):
      # no manda ni un email y no toca ningún dato real. No necesita los secretos.
      - name: Batería del wizard (caminos reales de una familia)
        run: npm run e2e:wizard
        working-directory: frontend

  build:
    needs: [e2e, escrituras-directas, selector-appsheet]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_GAS_ENDPOINT: ${{ secrets.GAS_ENDPOINT }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}

      - name: Verify dist contents
        run: ls -la frontend/dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
