name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # CONTROL DE SEGURIDAD — este backend se despliega como ANYONE_ANONYMOUS: cualquiera en
  # internet puede invocar lo que esté en su dispatcher. Un backend así con credenciales de
  # ESCRITURA de AppSheet es un vector de ataque directo, así que TODA escritura vive en el
  # KMS y se alcanza vía kmsProxy_. Este trabajo comprueba que sigue siendo verdad.
  #
  # Vive AQUÍ y no en el KMS a propósito: el control nació allí leyendo este repositorio
  # como hermano de checkout, y en la integración continua del KMS ese hermano no existe,
  # así que se declaraba INERTE y no comprobaba nada. El control se ejecuta donde vive el
  # código que vigila. `build` depende de él: en ROJO no se publica.
  #
  # No necesita `npm ci`, ni navegador, ni red: solo lee ficheros (~1 s).
  escrituras-directas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # El veredicto se lee de la ÚLTIMA línea, nunca del código de salida — pero el código
      # de salida es lo que hace fallar este trabajo, así que NO se canaliza por una tubería
      # (una tubería devuelve el código del último comando, y así se cuela un rojo como verde).
      - name: Ninguna escritura directa a AppSheet desde el backend anónimo
        run: node scripts/comprobar-escrituras-directas.mjs

  # CONTROL DE ALCANCE — los filtros que este backend manda a AppSheet tienen que estar
  # escritos en el lenguaje que AppSheet entiende. `AND`/`OR` son FUNCIONES: puestos entre
  # medias, AppSheet NO da error — se queda con la PRIMERA condición y descarta el resto en
  # silencio. Medido el 2026-08-03: en `recFiles` eso devolvía las 23 filas vivas de la
  # escuela (21 familias) a una familia que tenía 3; en la recuperación por email hacía que
  # las guardas `ISBLANK` no se aplicaran y un expediente abandonado pasara por «ya enviada».
  #
  # La batería de navegador NO puede cazar esto: corre contra un backend simulado y nunca
  # llega a construir un Selector. Por eso este control existe aparte. `build` depende de él.
  #
  # No necesita `npm ci`, ni navegador, ni red: lee el traductor real y lo ejecuta (~1 s).
  selector-appsheet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Sin tubería: el veredicto se lee de la última línea, pero es el código de salida el
      # que hace fallar el trabajo, y una tubería devolvería el del último comando.
      - name: Los filtros a AppSheet usan AND()/OR() como funciones, no infijos
        run: node scripts/comprobar-selector-appsheet.mjs

  receptor-firmado:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # `notifyLiveStateChange_` es alcanzable desde internet SIN autenticación (está en el
      # `switch(action)` del doPost ANYONE_ANONYMOUS). Hasta el 2026-08-03 se «autenticaba»
      # comparando un secreto que venía DENTRO DEL PROPIO CUERPO: quien viera un mensaje
      # podía repetirlo para siempre. Este trabajo vigila que verifique firma, ventana y
      # no-repetición ANTES de mirar el contenido (DL-S106).
      - name: El receptor del aviso del KMS verifica ANTES de mirar el contenido
        run: node scripts/comprobar-receptor-firmado.mjs

  pantalla-del-cliente:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # `editable`, `signing_available` y `signing_ready` son decisiones de PANTALLA, no
      # hechos del expediente: las decide este cliente (DL-E41 ★ACOTACIÓN 2026-08-02). Se
      # calculaban en dos sitios —aquí y en el KMS— y ya divergían en `signing_available`,
      # que es el campo que abre el avance 7→8.
      - name: Las banderas de pantalla salen de UN derivador y no se copian del KMS
        run: node scripts/comprobar-pantalla-del-cliente.mjs

  # CONTROL DE DATOS CON PESO LEGAL — `sysConsentsLog` es el libro que prueba qué consintió
  # una familia. Hasta el 2026-08-04 el resolvedor de tipos del wizard tenía un respaldo
  # `|| raw.toUpperCase()`: cualquier cadena sin correspondencia en el catálogo se convertía
  # en un «código» y se escribía en ese libro. Medido en la base antes de quitarlo: 12 filas
  # con `consent_type='LEGAL'`, un código que no existe en el catálogo Capa 2 y que nadie
  # lee. Y este dispatcher es ANYONE_ANONYMOUS: cualquiera podía elegir el código.
  #
  # No necesita `npm ci`, ni navegador, ni red: extrae el resolvedor real y lo ejecuta (~1 s).
  codigos-de-consentimiento:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Sin tubería: el veredicto se lee de la última línea, pero es el código de salida el
      # que hace fallar el trabajo, y una tubería devolvería el del último comando.
      - name: Ningún consentimiento se registra con un código inventado
        run: node scripts/comprobar-codigos-de-consentimiento.mjs

  no-escribe-estado:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # D33 / DL-S115: el envío completa la marca APPLICATION_FORM_COMPLETED y una regla
      # mueve la ficha IN→RQ por el motor del KMS. El wizard NO escribe el estado ni dispara
      # por su cuenta el correo de «solicitud recibida». Este control lo vigila donde vive el
      # código (aquí, no en el KMS, donde sería inerte). `build` depende de él ⇒ en ROJO no
      # se publica.
      - name: El wizard no escribe el estado ni manda el correo del envío
        run: node scripts/comprobar-que-el-wizard-no-escribe-estado.mjs

  # MURO DE DEPLOY — la batería del wizard tiene que estar VERDE antes de publicar.
  # Regla de los dos repos (CLAUDE.md §"No se toca lo que funciona sin una forma de
  # comprobar que sigue funcionando"): el 2026-07-27 un cambio de seguridad estuvo a
  # punto de romper el alta de solicitudes nuevas y no había NADA que lo cazara.
  # `build` depende de este job: si la batería sale ROJA, no se publica nada.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # Playwright NO es dependencia del wizard: se instala solo para la batería, sin
      # tocar package.json ni el lock (--no-save) para no ensuciar el bundle publicado.
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
        working-directory: frontend

      # La batería compila su propio bundle con backend SIMULADO (VITE_GAS_ENDPOINT=/__gas):
      # no manda ni un email y no toca ningún dato real. No necesita los secretos.
      - name: Batería del wizard (caminos reales de una familia)
        run: npm run e2e:wizard
        working-directory: frontend

  build:
    needs: [e2e, escrituras-directas, selector-appsheet, receptor-firmado, pantalla-del-cliente, codigos-de-consentimiento, no-escribe-estado]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_GAS_ENDPOINT: ${{ secrets.GAS_ENDPOINT }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}

      - name: Verify dist contents
        run: ls -la frontend/dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
