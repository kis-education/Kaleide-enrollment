# ─────────────────────────────────────────────────────────────────────────────
# LOOP DE AUDITORÍA DE SEGURIDAD — scheduler DURABLE (GitHub Actions)
#
# QUÉ ES: ejecuta cada hora el ciclo de auditoría de seguridad descrito en
#   kis-app/docs/kms/security/AUDIT-LOOP.md contra AMBOS repos
#   (kis-app + Kaleide-enrollment@main), consolida los hallazgos en
#   docs/kms/security/audit-<fecha>.md y vuelca lo accionable a
#   docs/kms/loop-backlog.md — y los PUBLICA en la rama del KMS de kis-app.
#
#   QUÉ RAMA DE kis-app: `master`. Desde la decisión D39 (2026-08-08) kis-app va
#   a UNA SOLA rama, `master`, con el KMS. Mientras dure la transición la verja
#   la resuelve EN EJECUCIÓN (ver el paso «Verja»): usa `develop` mientras esa
#   rama exista —es donde está el KMS hasta que se haga la fusión— y pasa a
#   `master` sola en cuanto se borre. Así no hace falta cronometrar este fichero
#   con el plan, y NUNCA escribe en `master` antes de la fusión.
#   SOLO DOCUMENTA. Nunca remedia código ni despliega (ni clasp, ni gas:build).
#
# POR QUÉ VIVE EN EL WIZARD (Kaleide-enrollment) Y NO EN kis-app:
#   `on: schedule` SOLO dispara desde la RAMA POR DEFECTO del repo. Cuando esto
#   se montó, la rama por defecto de kis-app era `master` y llevaba OTRA app en
#   producción (Assessment Matrix), así que un cron colgado ahí no dispararía
#   nunca sobre el KMS. La rama por defecto del wizard es `main` y aquí SÍ
#   dispara. Se queda donde está: mover el cron a kis-app tras la fusión es
#   posible, pero es un cambio aparte que hay que medir, no un efecto colateral
#   de renombrar una rama.
#
# POR QUÉ NECESITA UN PAT (AUDIT_PUSH_TOKEN):
#   el GITHUB_TOKEN nativo de una corrida solo alcanza a SU propio repositorio
#   (Kaleide-enrollment). Publicar los informes en kis-app exige un
#   token con acceso cruzado a kis-education/kis-app.
#
# SECRETOS REQUERIDOS (Settings → Secrets and variables → Actions, en
#   github.com/kis-education/Kaleide-enrollment):
#   • ANTHROPIC_API_KEY   — API key de Anthropic (console.anthropic.com).
#       Alternativa por suscripción Pro/Max/Team: crea el secreto
#       CLAUDE_CODE_OAUTH_TOKEN (con `claude setup-token`) y cambia la línea
#       `anthropic_api_key:` de abajo por
#       `claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}`.
#   • AUDIT_PUSH_TOKEN    — PAT fine-grained con:
#       - Repository access: kis-education/kis-app  (Contents: Read and write)
#       - Repository access: kis-education/Kaleide-enrollment (Contents: Read)
#       Se usa en DOS pasos de bash y en ninguno más: la verja (para clonar) y
#       la publicación (para el push del informe). Solo se escribe
#       DOCUMENTACIÓN, y solo en la rama del KMS de kis-app: en el wizard NUNCA
#       se escribe nada.
#
# DÓNDE VIVE EL PAT, Y POR QUÉ NO EN LA CONFIGURACIÓN GLOBAL DE GIT (②31):
#   El paso de Claude lanza un agente SIN SUPERVISIÓN que LEE ficheros de los
#   repositorios auditados. Texto puesto adrede en cualquiera de esos ficheros
#   puede intentar dirigir al agente («inyección de instrucciones»), y el
#   enmascarado de secretos de GitHub tapa los REGISTROS, no el TRÁFICO DE
#   SALIDA. Por eso el PAT —que tiene ESCRITURA sobre kis-app— NO se deja en la
#   configuración git global del runner (`~/.gitconfig`, en claro y legible por
#   el agente): se inyecta con las variables GIT_CONFIG_* DENTRO del `run:` que
#   lo necesita, y esas variables mueren con el shell de ese paso.
#   Consecuencia buscada: cuando corre el agente NO hay ninguna credencial de
#   git a su alcance. No puede publicar, y por tanto tampoco puede escribir
#   fuera de lo permitido: la regla «SOLO DOCUMENTAR» deja de depender de que
#   el agente obedezca y pasa a ser mecánica. El informe lo publica el paso
#   «Publicar…», que además COMPRUEBA que solo cambió documentación.
#   NO devolver esto a `git config --global`: es cómodo y es justo el defecto.
#
# CÓMO SE LEE EL RESULTADO: la verja barata (bash, sin coste de Claude) decide
#   si hay código nuevo comparando los tips actuales con los SHAs de la última
#   auditoría (`**Commit auditado:**`). Si NO hay código nuevo, el job termina
#   VERDE sin invocar a Claude (no se duplican informes).
#
# ESQUEMA DE LA ACTION (verificado en code.claude.com/docs/en/github-actions,
#   ejemplo "Run on a schedule", 2026-08): `anthropics/claude-code-action@v1`;
#   el input `prompt` activa el "automation mode"; `--model` y `--allowedTools`
#   se pasan como argumentos CLI dentro de `claude_args`.
# ─────────────────────────────────────────────────────────────────────────────

name: Security audit loop (durable scheduler)

on:
  schedule:
    # Horario, minuto 17 (off-minute) para no colisionar con la flota de crons.
    - cron: '17 * * * *'
  workflow_dispatch: {}

# Una corrida a la vez: nunca dos auditorías solapadas escribiendo a la vez.
concurrency:
  group: security-audit-loop
  cancel-in-progress: false

# Permisos mínimos. `contents: read` sobre ESTE repo (el wizard); la escritura
# de los informes va a kis-app vía AUDIT_PUSH_TOKEN, no vía GITHUB_TOKEN.
# `id-token: write` lo exige la propia action para su autenticación (todos los
# ejemplos oficiales lo incluyen); no concede acceso a ningún repo por sí solo.
permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # El working dir del runner. Todo el trabajo real ocurre en clones
      # frescos en /tmp; este checkout solo da un repo git válido de contexto.
      - name: Checkout (wizard, contexto)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # Sin credencial pegada en .git/config. Este checkout es SOLO contexto
          # (nadie vuelve a hacer fetch/push desde él) y el agente lo tiene
          # delante: `actions/checkout` deja si no el GITHUB_TOKEN nativo en
          # `http.<url>.extraheader`, otra credencial a su alcance sin motivo.
          persist-credentials: false

      # VERJA BARATA — sin Claude, sin coste de tokens. Clona ambos repos y
      # compara el SHA de la última auditoría con los tips.
      # El PAT vive SOLO dentro de este `run:` (variables GIT_CONFIG_*, que
      # mueren con el shell del paso) — ver la cabecera §"DÓNDE VIVE EL PAT".
      # La identidad del bot sí queda global: no es un secreto, y el paso de
      # publicación la necesita para firmar el commit.
      - name: Verja — ¿hay código nuevo desde la última auditoría?
        id: gate
        env:
          AUDIT_PUSH_TOKEN: ${{ secrets.AUDIT_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          # Credencial git ACOTADA A ESTE PASO: cualquier https://github.com/...
          # usa el PAT (insteadOf, sin que el token aparezca en las URLs de los
          # remotos) — pero por variables de entorno, NO en ~/.gitconfig, así el
          # paso siguiente (el agente) no la hereda. NO cambiar a --global.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${AUDIT_PUSH_TOKEN}@github.com/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/"

          git config --global user.name  "kaleide-audit-bot"
          git config --global user.email "audit-bot@users.noreply.github.com"

          rm -rf /tmp/kisapp /tmp/wiz

          # ── Qué rama de kis-app lleva el KMS (transición D39, 2026-08-08) ──
          # El destino es `master`. Mientras `develop` siga existiendo es esa la
          # que lo lleva (la fusión es el paso 4 del plan), así que se prefiere
          # y NUNCA se escribe en `master` antes de tiempo. En cuanto `develop`
          # se borre (paso 5), esto pasa a `master` solo, sin tocar el fichero.
          # Cuando ya no exista `develop`, este bloque se puede reducir a
          # KIS_BRANCH=master.
          KIS_BRANCH=master
          if git ls-remote --exit-code --heads https://github.com/kis-education/kis-app.git develop >/dev/null 2>&1; then
            KIS_BRANCH=develop
          fi
          echo "Rama del KMS en kis-app: $KIS_BRANCH"
          echo "kis_branch=$KIS_BRANCH" >> "$GITHUB_OUTPUT"

          git clone --depth 1 --branch "$KIS_BRANCH" https://github.com/kis-education/kis-app.git            /tmp/kisapp
          git clone --depth 1 --branch main          https://github.com/kis-education/Kaleide-enrollment.git /tmp/wiz

          KIS_TIP=$(git -C /tmp/kisapp rev-parse HEAD)
          WIZ_TIP=$(git -C /tmp/wiz    rev-parse HEAD)
          echo "Tip actual kis-app@$KIS_BRANCH:        $KIS_TIP"
          echo "Tip actual Kaleide-enrollment@main:    $WIZ_TIP"
          # El paso de publicación lo usa como BASE: lo que el agente añada por
          # encima de este SHA es exactamente lo que se va a publicar, y es lo
          # que se comprueba que sea solo documentación.
          echo "kis_tip=$KIS_TIP" >> "$GITHUB_OUTPUT"

          # Última auditoría (los nombres audit-YYYY-MM-DD.md ordenan cronológico).
          LATEST=$(ls /tmp/kisapp/docs/kms/security/audit-*.md 2>/dev/null | sort | tail -1 || true)
          if [ -z "$LATEST" ]; then
            echo "No hay auditorías previas → hay que auditar."
            echo "has_new_code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Última auditoría: $LATEST"

          LINE=$(grep -m1 'Commit auditado' "$LATEST" || true)
          # Acepta las dos ramas: los informes viejos dicen `kis-app@develop` y
          # los nuevos dirán `kis-app@master`. Si solo se aceptara una, la verja
          # dejaría de parsear y auditaría de más en cada corrida.
          KIS_SHA=$(printf '%s' "$LINE" | grep -oE 'kis-app@(develop|master) [0-9a-f]+' | awk '{print $2}' || true)
          WIZ_SHA=$(printf '%s' "$LINE" | grep -oE 'Kaleide-enrollment@main [0-9a-f]+'  | awk '{print $2}' || true)
          echo "SHA auditado kis-app:  ${KIS_SHA:-<ninguno>}"
          echo "SHA auditado wizard:   ${WIZ_SHA:-<ninguno>}"

          # Si no se pudo parsear alguno de los SHAs → auditar (fail-safe: mejor
          # una auditoría de más que saltarse código nuevo por un parseo frágil).
          if [ -z "$KIS_SHA" ] || [ -z "$WIZ_SHA" ]; then
            echo "No se pudo parsear el SHA auditado → auditar por seguridad."
            echo "has_new_code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Los SHAs del informe son cortos: hay código nuevo si el tip NO empieza
          # por el SHA auditado.
          NEW=false
          case "$KIS_TIP" in "$KIS_SHA"*) ;; *) NEW=true ;; esac
          case "$WIZ_TIP" in "$WIZ_SHA"*) ;; *) NEW=true ;; esac

          if [ "$NEW" = "true" ]; then
            echo "Hay código nuevo en al menos un repo → se audita."
            echo "has_new_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sin código nuevo en ningún repo → no se audita (no se duplica informe)."
            echo "has_new_code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auditoría (Claude Code, solo si hay código nuevo)
        if: steps.gate.outputs.has_new_code == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Se pasa el GITHUB_TOKEN nativo para NO depender de tener instalada la
          # Claude GitHub App en este repo. Alcanza SOLO a este repositorio y
          # SOLO en lectura (`permissions: contents: read`, arriba): no sirve
          # para publicar el informe. El push a kis-app lo hace el paso
          # siguiente, con el PAT, ya fuera del alcance del agente.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Sin WebFetch en la lista: la auditoría es ESTÁTICA y no consulta nada
          # de la red — ni AUDIT-LOOP.md ni el encargo de abajo piden una sola
          # URL (②31). Ojo: dentro del bloque `claude_args` NO caben comentarios
          # (cada línea se pasa como argumento al CLI), por eso van aquí.
          claude_args: |
            --model claude-opus-4-8
            --max-turns 200
            --allowedTools "Bash,Read,Grep,Glob,Edit,Write,Task"
          prompt: |
            Ejecuta el ciclo de auditoría de seguridad definido en
            docs/kms/security/AUDIT-LOOP.md contra
            kis-app@${{ steps.gate.outputs.kis_branch }} y
            Kaleide-enrollment@main.

            Preparación (LÉELA ENTERA, cambió): NO tienes credenciales de git y
            NO vas a publicar nada. Los dos repositorios YA están clonados en
            este runner, cada uno en su directorio aislado y solo para ti:
              • /tmp/kisapp — kis-app@${{ steps.gate.outputs.kis_branch }}
              • /tmp/wiz    — Kaleide-enrollment@main
            Lee /tmp/kisapp/docs/kms/security/AUDIT-LOOP.md y sigue su
            especificación al pie de la letra, con estas dos salvedades sobre su
            mecánica: (a) esos dos clones YA SON tus checkouts aislados —no
            clones ni sincronices nada, no hay red ni credencial para hacerlo—;
            (b) el paso 6 de esa especificación («commit + push») aquí NO lo
            haces tú: escribe los ficheros y haz commit LOCAL en /tmp/kisapp, y
            PARA AHÍ. Un paso posterior de este mismo trabajo, sin agente,
            rebasa y publica lo que hayas dejado commiteado. Si intentas un
            `git push` fallará, y con razón.

            Reglas (no negociables):
            - Auditoría ESTÁTICA: sin credenciales, sin explotación en vivo, sin
              salir a la red, sin sacar PII (solo agregados redactados).
            - Lanza agentes background ADVERSARIALES estáticos por superficie
              (auth/IDOR row-scope, KAL-4/KAL-5/KIS-4, webhooks/HMAC, PII/KIS-11,
              dinero/fin*, wizard anónimo). NO modifiques código de aplicación.
            - Consolida los hallazgos en docs/kms/security/audit-<fecha>.md.
              INCLUYE, con este formato EXACTO para que la verja barata del cron
              lo pueda parsear en la próxima corrida, la línea:
              **Commit auditado:** `kis-app@${{ steps.gate.outputs.kis_branch }} <sha-corto>` · `Kaleide-enrollment@main <sha-corto>`
              (los SHAs cortos de los tips que auditaste).
            - Vuelca lo ACCIONABLE a docs/kms/loop-backlog.md DEDUPLICANDO primero
              contra su contenido (no repitas hallazgos ya listados).
            - SOLO DOCUMENTAR: nunca remedies código ni despliegues (ni clasp, ni
              gas:build, ni cdn:push).
            - Commit LOCAL en /tmp/kisapp y SOLO de documentación: únicamente
              docs/kms/security/* y docs/kms/loop-backlog.md. Nada más, ni un
              fichero. El paso de publicación LO COMPRUEBA y aborta sin publicar
              si aparece cualquier otra ruta, así que un desliz aquí tira la
              corrida entera a la basura. No toques /tmp/wiz: en el wizard no se
              escribe nada.
            - Trailers OBLIGATORIOS en el commit:
              Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>
              Claude-Session: https://claude.ai/code/session_013BjEPNYz1oenbi9pKZhQ3b

            Si al mirar los clones no hubiera nada que auditar (no debería, la
            verja ya lo comprobó), termina sin crear informe y sin commitear.

      # PUBLICACIÓN — el ÚNICO sitio, junto a la verja, donde vuelve a aparecer
      # el PAT. Es un paso de bash APARTE y POSTERIOR al agente a propósito:
      # mientras la auditoría corre no hay credencial en el runner (ver la
      # cabecera §"DÓNDE VIVE EL PAT"), y el trabajo mecánico de git —rebasar y
      # publicar— no tiene por qué hacerlo algo que lee ficheros ajenos.
      # Se salta si el agente falló (un paso fallido corta el trabajo).
      - name: Publicar el informe en kis-app (bash, sin agente)
        if: steps.gate.outputs.has_new_code == 'true'
        env:
          AUDIT_PUSH_TOKEN: ${{ secrets.AUDIT_PUSH_TOKEN }}
          KIS_BRANCH: ${{ steps.gate.outputs.kis_branch }}
          KIS_BASE: ${{ steps.gate.outputs.kis_tip }}
        run: |
          set -euo pipefail
          cd /tmp/kisapp

          # Red de recogida: si el agente escribió los ficheros pero no llegó a
          # commitear, se commitean aquí. Solo las dos rutas permitidas — lo que
          # haya dejado fuera de ellas NO se recoge, y el guardián de abajo lo
          # caza igualmente si lo commiteó él.
          git add -- docs/kms/security docs/kms/loop-backlog.md 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q \
              -m "Auditoría de seguridad automática (cron horario)" \
              -m "Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>" \
              -m "Claude-Session: https://claude.ai/code/session_013BjEPNYz1oenbi9pKZhQ3b"
          fi

          # ¿Hay algo que publicar? Sin commits nuevos sobre la base, se termina
          # VERDE: la auditoría pudo no encontrar nada que anotar.
          if [ "$(git rev-parse HEAD)" = "$KIS_BASE" ]; then
            echo "El agente no dejó ningún commit → nada que publicar."
            exit 0
          fi

          # GUARDIÁN «SOLO DOCUMENTAR», mecánico. La regla estaba solo escrita en
          # el encargo del agente, o sea que dependía de que obedeciera; aquí se
          # comprueba. Cualquier ruta fuera de estas dos ABORTA sin publicar.
          CHANGED=$(git diff --name-only "$KIS_BASE" HEAD)
          if [ -z "$CHANGED" ]; then
            echo "Commits sin cambios de fichero → nada que publicar."
            exit 0
          fi
          echo "Ficheros que se publicarían:"; printf '  %s\n' $CHANGED
          BAD=$(printf '%s\n' "$CHANGED" \
                | grep -vE '^docs/kms/security/|^docs/kms/loop-backlog\.md$' || true)
          if [ -n "$BAD" ]; then
            echo "ABORTA: la auditoría tocó ficheros fuera de la documentación permitida:"
            printf '  %s\n' $BAD
            exit 1
          fi

          # Credencial ACOTADA A ESTE PASO (igual que en la verja): variables de
          # entorno, nunca ~/.gitconfig. NO cambiar a --global.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${AUDIT_PUSH_TOKEN}@github.com/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/"

          # El clon de la verja es --depth 1: para rebasar hace falta historia
          # suficiente para encontrar el antepasado común. Si otra mano publicó
          # en esta hora, el rebase la respeta; si choca, el paso falla en ROJO
          # (nunca se fuerza el empujón sobre trabajo ajeno).
          git fetch --unshallow origin "$KIS_BRANCH" || git fetch origin "$KIS_BRANCH"
          git rebase FETCH_HEAD
          git push origin "HEAD:$KIS_BRANCH"
          echo "Informe publicado en kis-app@$KIS_BRANCH."
